name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build

  docker:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stockflow .
      - name: Smoke test (salud, SPA y login)
        run: |
          docker run -d --name app -p 8080:8080 -e JWT_SECRET=ci-only-secret stockflow
          for i in $(seq 1 30); do curl -fs localhost:8080/api/salud && break; sleep 1; done
          curl -fs localhost:8080/ | grep -q '<sf-root'
          curl -fs localhost:8080/productos | grep -q '<sf-root'
          curl -fs -X POST localhost:8080/api/sesion -H 'Content-Type: application/json' \
            -d '{"nombre_usuario":"admin","contrasena":"admin123"}' | grep -q '"token"'
      - name: Auditoría de la API (roles, permisos y coherencia de datos)
        run: python3 .github/scripts/api_audit.py
      - name: Logs del contenedor
        if: always()
        run: docker logs app 2>&1 | tail -30
